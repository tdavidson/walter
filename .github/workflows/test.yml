name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Results and compatibility table are up to date
        run: |
          npm run -s vectors
          npm run -s compat
          git diff --exit-code results COMPATIBILITY.md
      - name: Package builds and the walter command runs
        run: |
          npm run build -w engine
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/engine/dist/cli.js" init
          node "$GITHUB_WORKSPACE/engine/dist/cli.js" run terms.json flows.json
          node "$GITHUB_WORKSPACE/engine/dist/cli.js" serve --port 3790 &
          sleep 1
          node -e "const fs=require('fs');fetch('http://127.0.0.1:3790/run',{method:'POST',body:JSON.stringify({terms:JSON.parse(fs.readFileSync('terms.json')),flows:JSON.parse(fs.readFileSync('flows.json'))})}).then(r=>{if(r.status!==200)process.exit(1);return r.json()}).then(j=>{if(!j.totals)process.exit(1);console.log('serve ok')})"
          kill %1
