name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Results and compatibility table are up to date
        run: |
          npm run -s vectors
          npm run -s compat
          git diff --exit-code results COMPATIBILITY.md
